<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acesso - Roblox</title>
    <!-- Script oficial do reCAPTCHA v2 padrão -->
    <script src="https://www.google.com/recaptcha/api.js" async defer></script>
    <style>
        body {
            margin: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background-color: #121212;
            font-family: Arial, sans-serif;
            color: white;
        }
        .box {
            background-color: #1e1e1e;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
            text-align: center;
            width: 90%;
            max-width: 350px;
        }
        .btn-opcao {
            background-color: #2a2a2a;
            color: white;
            padding: 14px;
            font-size: 16px;
            font-weight: bold;
            text-decoration: none;
            border-radius: 8px;
            border: 2px solid #444;
            cursor: pointer;
            width: 100%;
            transition: 0.2s;
        }
        .btn-opcao:hover {
            border-color: #0070f3;
            background-color: #333;
        }
        .btn-app {
            border-color: #28a745;
        }
        .btn-app:hover {
            border-color: #34d058;
        }
        .roblox-link {
            background-color: #0070f3;
            color: white;
            padding: 12px 25px;
            font-size: 16px;
            font-weight: bold;
            text-decoration: none;
            border-radius: 8px;
            border: none;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
            width: 100%;
        }
        .roblox-link:hover {
            background-color: #0051bb;
        }
        .escondido {
            display: none !important;
        }
    </style>
</head>
<body>

    <!-- TELA 1: Escolha entre App ou Site -->
    <div class="box" id="tela-escolha">
        <h2>Como deseja abrir?</h2>
        <p style="font-size: 14px; color: #aaa;">Escolha onde quer acessar o conteúdo:</p>
        
        <button onclick="escolherApp()" class="btn-opcao btn-app">📱 Abrir no App do Roblox</button>
        <button onclick="escolherSite()" class="btn-opcao">🌐 Abrir no Navegador (Site)</button>
    </div>

    <!-- TELA 2: A Verificação do reCAPTCHA -->
    <div class="box escondido" id="tela-captcha">
        <h2>Verificação de Segurança</h2>
        <p style="font-size: 14px; color: #aaa;">Confirme que você não é um robô:</p>

        <!-- Div padrão do reCAPTCHA v2 -->
        <div class="g-recaptcha" data-sitekey="6Ld-x3ItAAAAAL1D-84aGFLKyvxUyEXS5KpGhIKj"></div>

        <button onclick="verificarCaptcha()" class="roblox-link" style="margin-top: 10px;">Continuar para o Link</button>
    </div>

    <script>
        function escolherApp() {
            window.location.href = "roblox://";
            setTimeout(function() {
                alert("Se o app não abrir, tente escolher a opção do Navegador (Site)!");
            }, 2000);
        }

        function escolherSite() {
            // Esconde a tela de escolha e mostra a tela do reCAPTCHA
            document.getElementById("tela-escolha").classList.add("escondido");
            document.getElementById("tela-captcha").classList.remove("escondido");
        }

        function verificarCaptcha() {
            var resposta = grecaptcha.getResponse();

            if (resposta.length === 0) {
                alert("Por favor, marque a caixa do reCAPTCHA primeiro!");
            } else {
                window.location.href = "https://links.lootlabs.gg/s?aj7mVFjG";
            }
        }
    </script>

</body>
</html>
