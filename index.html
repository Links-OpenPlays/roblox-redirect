<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Abrir Roblox</title>
    <!-- Script oficial do reCAPTCHA v3 com a sua chave -->
    <script src="https://www.google.com/recaptcha/api.js?render=6LfZvHItAAAAAONdFuJkYHT6HvdYqN7nc5t6_Yia"></script>
    <style>
        body {
            margin: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background-color: #121212;
            font-family: Arial, sans-serif;
            color: white;
        }
        .box {
            background-color: #1e1e1e;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
            text-align: center;
            width: 85%;
            max-width: 350px;
        }
        .roblox-link {
            background-color: #0070f3;
            color: white;
            padding: 12px 25px;
            font-size: 16px;
            font-weight: bold;
            text-decoration: none;
            border-radius: 8px;
            border: none;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
            transition: background-color 0.2s, transform 0.2s;
            width: 100%;
        }
        .roblox-link:hover {
            background-color: #0051bb;
        }
        .status {
            font-size: 14px;
            color: #888;
        }
    </style>
</head>
<body>

    <div class="box">
        <h2>Verificação de Segurança</h2>
        <p class="status" id="status-texto">Clique para prosseguir com segurança.</p>
        
        <button onclick="verificarGoogleV3()" class="roblox-link">Continuar</button>
    </div>

    <script>
        function verificarGoogleV3() {
            document.getElementById("status-texto").innerText = "Carregando...";

            grecaptcha.ready(function() {
                grecaptcha.execute('6LfZvHItAAAAAONdFuJkYHT6HvdYqN7nc5t6_Yia', {action: 'submit'}).then(function(token) {
                    if (token) {
                        // Token gerado com sucesso pelo Google! Redireciona para o link
                        window.location.href = "https://links.lootlabs.gg/s?aj7mVFjG";
                    } else {
                        alert("Erro na validação do reCAPTCHA.");
                        document.getElementById("status-texto").innerText = "Tente novamente.";
                    }
                });
            });
        }
    </script>

</body>
</html>
