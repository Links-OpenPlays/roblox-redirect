<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Abrir Roblox</title>
    <style>
        body {
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #121212;
            font-family: Arial, sans-serif;
        }
        .roblox-link {
            background-color: #0070f3;
            color: white;
            padding: 15px 30px;
            font-size: 18px;
            font-weight: bold;
            text-decoration: none;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
            transition: background-color 0.2s, transform 0.2s;
            cursor: pointer;
        }
        .roblox-link:hover {
            background-color: #0051bb;
            transform: scale(1.05);
        }
    </style>
</head>
<body>

    <a href="https://lootdest.org/s?aj7mVFjG" class="roblox-link">Acessar o Roblox</a>

</body>
</html>
