<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verificação de Segurança - Roblox</title>
    <!-- Script oficial do reCAPTCHA v3 (usando a sua Site Key) -->
    <script src="https://www.google.com/recaptcha/api.js?render=6LfZvHItAAAAAONdFuJkYHT6HvdYqN7nc5t6_Yia"></script>
    <style>
        body {
            margin: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background-color: #121212;
            font-family: Arial, sans-serif;
            color: white;
        }
        .box {
            background-color: #1e1e1e;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
            text-align: center;
        }
        .roblox-link {
            background-color: #0070f3;
            color: white;
            padding: 12px 25px;
            font-size: 16px;
            font-weight: bold;
            text-decoration: none;
            border-radius: 8px;
            border: none;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
            transition: background-color 0.2s, transform 0.2s;
        }
        .roblox-link:hover {
            background-color: #0051bb;
            transform: scale(1.05);
        }
        .status {
            font-size: 14px;
            color: #888;
        }
    </style>
</head>
<body>

    <div class="box">
        <h2>Proteção Anti-Bot Ativa</h2>
        <p class="status" id="status-texto">Clique abaixo para verificar e continuar.</p>
        
        <!-- Botão que dispara a verificação invisível do v3 -->
        <button onclick="executarVerificacao()" class="roblox-link">Verificar e Acessar</button>
    </div>

    <script>
        function executarVerificacao() {
            document.getElementById("status-textoinnerText") = "Analisando segurança...";
            
            grecaptcha.ready(function() {
                grecaptcha.execute('6LfZvHItAAAAAONdFuJkYHT6HvdYqN7nc5t6_Yia', {action: 'homepage'}).then(function(token) {
                    // Se o Google gerou o token com sucesso, a verificação passou!
                    if (token) {
                        document.getElementById("status-texto").innerText = "Tudo certo! Redirecionando...";
                        window.location.href = "https://links.lootlabs.gg/s?aj7mVFjG";
                    } else {
                        alert("Falha na verificação de segurança.");
                    }
                });
            });
        }
    </script>

</body>
</html>
